<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Applied Web Project - apply page (Fantastic5)">
        <meta name="keywords" content="HTML, COS10026, Project, Apply page, Fantastic5">
        <meta name="author" content="Alagarsamy Chandrasekar Shashanth Kumar">
        <title>Apply</title>

        <link rel="stylesheet" href="styles/apply.css">
    </head>

    <body>

        <h1> Apply </h1>

        <br>

        <!-- form created -->
        <form action="submit.php" method="post">

            <!-- Job Reference number element-->
                <label for="job_ref_num">Job Reference Number:</label>
                <input type="text" id="job_ref_num" name="job_ref_num" pattern="[0-9]{6}" required>

                <br>

            <!-- Personal Details fieldset-->
            <fieldset class="personal-details-main-fieldset">

                <legend>Personal Details</legend>

                <!-- First Name Field -->
                 <div class="personal-details">
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" pattern="[A-Za-z\s]{1,20}" required>
                 </div>

                <!-- Last Name Field -->
                 <div class="personal-details">
                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" pattern="[A-Za-z\s]{1,20}" required>
                 </div>

                <!-- Date of birth Field -->
                 <div class="personal-details">
                    <label for="DOB">Date of birth:</label>
                    <input type="date" id="DOB" name="DOB" required>
                 </div>

                <!-- Radio Buttons for Gender fields -->
                 <fieldset class="gender-subgroup">
                    <legend>Gender</legend>

                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female" required>
                    <label for="female">Female</label>

                 </fieldset>
            </fieldset>


            <!-- Address fieldset -->
            <fieldset class="address-main-fieldset">

                <legend>Address</legend>

                <!-- Street Address Field -->
                 <div class="address">
                    <label for="street_address">Street Address:</label>
                    <input type="text" id="street_address" name="street_address" pattern="[A-Za-z0-9\s]{1,40}" required>
                 </div>

                <!-- Address Field -->
                 <div class="address">
                    <label for="suburb_town">Suburb/Town:</label>
                    <input type="text" id="suburb_town" name="suburb_town" pattern="[A-Za-z0-9\s]{1,40}" required>
                 </div>

                <!-- Dropdown list for state selection-->
                 <div class="state-subgroup">
                    <label for="state">State</label>
                    <select id="state" name="state">

                        <option value="">Please select</option>
                        <option value="VIC">VIC</option>
                        <option value="NSW">NSW</option>
                        <option value="QLD">QLD</option>
                        <option value="NT">NT</option>
                        <option value="WA">WA</option>
                        <option value="SA">SA</option>
                        <option value="TAS">TAS</option>
                        <option value="ACT">ACT</option>

                    </select>
                 </div>

                <!-- Postcode field -->
                 <div class="address">
                    <label for="postcode">Postcode</label>
                    <input type="text" id="postcode" name="postcode" pattern="[0-9]{4}" required>
                 </div>

            </fieldset>


            <!-- Contact Details fieldset -->
            <fieldset class="contact-details-main-fieldset">

               <legend>Contact Details</legend>

               <!-- Email field -->
               <div class="contact-details">
                  <label for="email">Email:</label>
                  <input type="email" id="email" name="email" required>
               </div>

               <!-- Phone number field -->
               <div class="contact-details">
                  <label for="phone_number">Phone Number:</label>
                  <input type="text" id="phone_number" name="phone_number" [0-9] {8,12} required>
               </div>

            </fieldset>
            

            <!-- Skills And Qualifications fieldset -->
            <fieldset class="skills-and-qualifications-main-fieldset">

               <legend>Skills and Qualifications</legend>

               <!-- the following are the checkbox fields for the 'Skills' field -->

               <div class="skills-subgroup">
                  <label for="html">HTML</label>
                  <input type="checkbox" id="html" name="issues[]" value="HTML" checked>
               </div>

               <div class="skills-subgroup">
                  <label for="css">CSS</label>
                  <input type="checkbox" id="css" name="issues[]" value="CSS">
               </div>

               <div class="skills-subgroup">
                  <label for="javascript">JavaScript</label>
                  <input type="checkbox" id="javascript" name="issues[]" value="JavaScript">
               </div>

               <div class="skills-subgroup">
                  <label for="php">PHP</label>
                  <input type="checkbox" id="php" name="issues[]" value="PHP">
               </div>

               <div class="skills-subgroup">
                  <label for="mysql">MySQL</label>
                  <input type="checkbox" id="mysql" name="issues[]" value="MySQL">
               </div>


               <!-- 'Other Skills' text area field-->
               <div class="other-skills-subgroup">
                  <label for="other-skills">Other skills:</label>
                  <textarea id="other-skills" name="other-skills" rows="10" cols="50" placeholder="List any other relevant skills or qualifications..."></textarea>
               </div>
               

            </fieldset>

        </form>

    </body>
</html>
